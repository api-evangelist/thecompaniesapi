meters:
- name: monthly_subscription
  description: Flat monthly plan fee bundling a fixed credit allowance (Startup/Scaleup/Enterprise).
  unit: subscription
  aggregation: sum
  dimensions:
  - account
  - plan
- name: included_credits
  description: Credits included in the monthly plan allowance and consumed by API calls.
  unit: credits
  aggregation: sum
  dimensions:
  - account
  - plan
- name: overage_credits
  description: Credits consumed beyond the plan allowance, billed per 1,000 additional credits.
  unit: credits
  aggregation: sum
  dimensions:
  - account
  - plan
- name: free_credits
  description: One-time 500 free credits granted to new accounts for evaluation.
  unit: credits
  aggregation: sum
  dimensions:
  - account
principles:
- name: Visibility
  description: Track credit burn per API token and per endpoint (search vs enrichment vs Actions) to see where spend concentrates.
- name: Allocation
  description: Issue separate API tokens per team/workload and map credit consumption to internal cost centers.
- name: Optimization
  description: Batch large jobs through the Actions queue, cache enrichment results by domain, size the plan to actual monthly credit burn, and use annual billing (two months free) for steady workloads.
- name: Accountability
  description: Assign owners per token; review monthly credit consumption against the plan allowance to avoid overage surprises.
