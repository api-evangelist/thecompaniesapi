- Web Intelligence
- FinOps
- Cost Management
- FOCUS
description: >-
  FinOps view of The Companies API spend. The service is billed on a monthly
  subscription that bundles a fixed credit allowance (Startup 50k, Scaleup
  250k, Enterprise 500k) with metered overage priced per 1,000 additional
  credits. Work is denominated in credits, so cost tracks the volume and type
  of search, enrichment, and bulk (Actions) calls an account makes. New
  accounts receive 500 free credits. Annual billing yields two months free.
notes: >-
  Subscription prices, credit allowances, and overage rates captured from the
  public pricing page on 2026-07-11; verify against the live page during
  reconciliation. Per-operation credit costs are not fully enumerated here and
  should be confirmed in the developer docs.
