    maintaining target datasets. Endpoints include GET/POST /v2/lists,
    PATCH/DELETE /v2/lists/{listId}, GET/POST /v2/lists/{listId}/companies,
    PATCH /v2/lists/{listId}/companies/toggle, and GET
    /v2/lists/{listId}/companies/{domain}.
