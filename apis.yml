aid: thecompaniesapi
url: https://raw.githubusercontent.com/api-evangelist/thecompaniesapi/refs/heads/main/apis.yml
name: The Companies API
kind: company
description: The Companies API is a company data and enrichment platform offering
  programmatic access to firmographic, technographic, and web-intelligence data on
  50M+ companies. Its REST API (base https://api.thecompaniesapi.com, all resources
  under /v2) covers company search and segmentation, company enrichment by domain,
  email, or social profile, similar-company lookup, industry and technology reference
  data, location reference data, saved lists, and asynchronous bulk actions.
  Requests are authenticated with an API token passed in the Authorization header,
  billing is credit-based, and the full OpenAPI 3.1 description is published at
  /v2/openapi.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Company Data
- Data Enrichment
- Firmographics
- Web Intelligence
- B2B Data
- Reference Data
- Company Search
created: '2026-07-11'
modified: '2026-07-11'
specificationVersion: '0.19'
apis:
- aid: thecompaniesapi:thecompaniesapi-company-search-api
  name: The Companies API Company Search API
  tags:
  - Company Search
  - Firmographics
  - B2B Data
  - Segmentation
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.thecompaniesapi.com/api
  baseURL: https://api.thecompaniesapi.com/v2
  properties:
  - url: https://www.thecompaniesapi.com/api
    type: Documentation
  - url: https://thecompaniesapi.dev/api
    type: APIReference
  - url: openapi/thecompaniesapi-openapi.yml
    type: OpenAPI
  description: Search and segment the 50M+ company database with structured
    segmentation queries, natural-language prompts, or company name. Endpoints
    include GET/POST /v2/companies (search by segmentation), GET
    /v2/companies/by-name, GET /v2/companies/by-prompt, GET/POST
    /v2/companies/count (count matches), and GET /v2/companies/similar
    (lookalike companies from one or more domains).
- aid: thecompaniesapi:thecompaniesapi-company-enrichment-api
  name: The Companies API Company Enrichment API
  tags:
  - Data Enrichment
  - Company Data
  - Web Intelligence
  - Firmographics
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.thecompaniesapi.com/api
  baseURL: https://api.thecompaniesapi.com/v2
  properties:
  - url: https://www.thecompaniesapi.com/api
    type: Documentation
  - url: https://thecompaniesapi.dev/api
    type: APIReference
  - url: openapi/thecompaniesapi-openapi.yml
    type: OpenAPI
  description: Retrieve 100+ data points on a single company by its domain,
    a work email, or a social-media profile. Endpoints include GET
    /v2/companies/{domain}, GET /v2/companies/by-email, GET
    /v2/companies/by-social, GET /v2/companies/{domain}/context (full
    company context), GET /v2/companies/{domain}/email-patterns, and POST
    /v2/companies/{domain}/ask (ask a natural-language question about a company).
