aid: thecompaniesapi
url: https://raw.githubusercontent.com/api-evangelist/thecompaniesapi/refs/heads/main/apis.yml
name: The Companies API
kind: company
description: The Companies API is a company data and enrichment platform offering programmatic access
  to firmographic, technographic, and web-intelligence data on 50M+ companies. Its REST API (base https://api.thecompaniesapi.com,
  all resources under /v2) covers company search and segmentation, company enrichment by domain, email,
  or social profile, similar-company lookup, industry and technology reference data, location reference
  data, saved lists, and asynchronous bulk actions. Requests are authenticated with an API token passed
  in the Authorization header, billing is credit-based, and the full OpenAPI 3.1 description is published
  at /v2/openapi.
