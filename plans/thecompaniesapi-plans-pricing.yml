description: The Companies API is billed on a credit-based subscription model. Every new account starts
  with 500 free credits (no credit card required) for evaluation. Paid plans are monthly and bundle a
  fixed monthly credit allowance plus a per-second request rate limit, with metered overage priced per
  1,000 additional credits. All plans provide full access to every API feature and the complete 50M+ company
  database; higher tiers raise the credit allowance, raise the rate limit, and lower the overage rate.
  Annual billing gives two months free.
notes: 'Reconciled against the live pricing page on 2026-08-14: Startup $95/month with 50,000 credits,
  $2.50 per 1,000 additional credits, 50 RPS; Scaleup $295/month with 250,000 credits, $1.75 per 1,000,
  250 RPS; Enterprise $595/month with 500,000 credits, $1.50 per 1,000, 1,000 RPS. Annual billing is advertised
  as "two months free". All three tiers are published self-serve prices — there is no "contact sales"
  gate, though the page invites contact for hundreds-of-queries-per-second volumes. Every tier grants
  access to all API features and all 50M companies; the tiers differ only in credit allowance, RPS and
  overage rate. New accounts receive 500 free credits with no credit card. Overage rates are now confirmed
  exact rather than approximate.'
