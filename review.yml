aid: thecompaniesapi
name: The Companies API
review:
  question: Does The Companies API expose a documented public WebSocket API?
  answer: false
  date: '2026-07-11'
  reviewer: API Evangelist
  asyncapiSpecCreated: false
  asyncapiScopeNote: |
    No AsyncAPI document was authored. The Companies API's entire public
    surface is request/response REST over HTTPS, described by a single
    OpenAPI 3.1 document served at GET /v2/openapi. There is no server-push
    transport (WebSocket or SSE) to model. Long-running work (bulk
    enrichment and large searches) is handled by an asynchronous Actions
    job queue that is itself polled over REST (GET /v2/actions), not
    streamed. There is nothing for an AsyncAPI document to describe.
findings:
  summary: |
    The Companies API does not publish a documented public WebSocket API.
    It is a company data and enrichment platform exposing a single REST API
    at base https://api.thecompaniesapi.com, with every resource under the
    /v2 path. Requests are authenticated with an API token passed in the
    Authorization header (an apiKey security scheme in the OpenAPI). The
    full OpenAPI 3.1 description is published at GET /v2/openapi and lists
    37 paths. No realtime, bidirectional, or streaming WebSocket (ws:// or
    wss://) endpoint is documented anywhere in the spec or the developer
    docs as of the review date. Asynchronous / long-running work is offered
    through an Actions job queue (POST /v2/actions to request or estimate a
    job, GET /v2/actions to poll status, POST /v2/actions/{actionId}/retry)
    which is consumed over plain REST.
  openSource: |
    The Companies API is a proprietary hosted commercial service, not an
    open-source or self-hostable product. The company publishes open-source
    client SDKs (TypeScript/JavaScript, Python, Go) under github.com/thecompaniesapi,
    but the data platform and API themselves are closed and accessed only
    over the hosted endpoints. Access requires an account and API token;
    new accounts receive 500 free credits (no credit card required) for
    evaluation, after which usage is billed against a credit-based monthly
    plan.
  transports:
    - protocol: REST
      scheme: https
      baseURL: https://api.thecompaniesapi.com
      documented: true
      note: All resources under /v2. OpenAPI 3.1 published at GET /v2/openapi.
    - protocol: Async Jobs (REST-polled)
      scheme: https
      documented: true
      note: Actions job queue for bulk/long-running work. POST /v2/actions to enqueue/estimate, GET /v2/actions to poll, POST /v2/actions/{actionId}/retry. Polled over REST, not pushed.
    - protocol: WebSocket
      scheme: wss
      documented: false
      note: No WebSocket endpoint is documented anywhere in the OpenAPI spec or developer docs as of the review date.
