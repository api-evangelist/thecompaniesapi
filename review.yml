actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists. The Companies API's entire public
    API is request/response REST described by one OpenAPI 3.1 document, and
    asynchronous work is handled by a REST-polled Actions job queue rather
    than a server-push transport. No AsyncAPI document was created because
    there is nothing streaming to model.
