      responses:
        '200':
          description: Search countries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  countries:
                    type: array
                    items:
                      $ref: '#/components/schemas/NominatimCountry'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
                required:
                - countries
