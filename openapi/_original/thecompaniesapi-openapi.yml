externalDocs:
  description: The Companies API Documentation
  url: https://www.thecompaniesapi.com/docs
info:
  contact:
    email: support@thecompaniesapi.com
    name: The Companies API
    url: https://www.thecompaniesapi.com
  description: An enrichment platform to search and retrieve information about companies
  termsOfService: https://www.thecompaniesapi.com/product/terms
  title: The Companies API
  version: 2.0.0
openapi: 3.1.0
servers:
- description: Production server
  url: https://api.thecompaniesapi.com
components:
  securitySchemes:
    apiKey:
      description: The API key to use for authentication, you can get it from your API tokens page.
      in: header
      name: Authorization
      type: apiKey
  parameters:
    visitorId:
      content:
        text/plain:
          schema:
            type: string
      description: A unique identifier generated on a first visit to the website tracking demo features
        sessions.
      in: header
      name: Tca-Visitor-Id
      required: false
  schemas:
    SegmentationCondition:
      type: object
      properties:
        attribute:
          type: string
          enum:
          - about.businessType
          - about.industries
          - about.industry
          - about.name
          - about.totalEmployees
          - about.yearFounded
          - ai.search
          - analytics.monthlyVisitors
          - apps
          - codes.naics
          - codes.sic
          - contacts
          - domain.domain
          - domain.tld
          - finances.revenue
          - finances.stockExchange
          - locations.headquarters.city.code
          - locations.headquarters.continent.code
          - locations.headquarters.country.code
          - locations.headquarters.county.code
          - locations.headquarters.state.code
          - meta.listIds
          - meta.score
          - meta.syncedAt
          - socials
          - socials.linkedin.id
          - technologies.active
          - technologies.categories
          - urls
        blockedOperator:
          type: boolean
        operator:
          type: string
          enum:
          - and
          - or
        sign:
          type: string
          enum:
          - equals
          - exactEquals
          - greater
          - lower
          - notEquals
        values:
          type: array
          items:
            anyOf:
            - type: string
            - type: number
      required:
      - attribute
      - operator
      - sign
      - values
      description: A condition for our platform segmentation engine.
    Team:
      type: object
      properties:
        admin:
          type:
          - boolean
          - 'null'
        country:
          type:
          - string
          - 'null'
        createdAt:
          type:
          - string
          - 'null'
        credits:
          type: number
        creditsPack:
          type: number
        id:
          type: number
        name:
          type:
          - string
          - 'null'
        role:
          type:
          - string
          - 'null'
        stripeCustomerId:
          type:
          - string
          - 'null'
        stripeProductId:
          type:
          - string
          - 'null'
        stripeSubscribed:
          type: boolean
        stripeSubscriptionId:
          type:
          - string
          - 'null'
        stripeSubscriptionStatus:
          type:
          - string
          - 'null'
        websiteUrl:
          type:
          - string
          - 'null'
      required:
      - admin
      - country
      - createdAt
      - credits
      - creditsPack
      - id
      - name
      - stripeCustomerId
      - stripeProductId
      - stripeSubscribed
      - stripeSubscriptionId
      - stripeSubscriptionStatus
      - websiteUrl
      description: A collection of users that can access the same resources.
    User:
      type: object
      properties:
        colorMode:
          type: string
          enum:
          - dark
          - light
          - system
        createdAt:
          type:
          - string
          - 'null'
        currentTeamId:
          type:
          - number
          - 'null'
        email:
          type: string
        emailFree:
          type:
          - boolean
          - 'null'
        emailVerified:
          type:
          - boolean
          - 'null'
        emailVerifiedResentAt:
          type:
          - string
          - 'null'
        fullName:
          type:
          - string
          - 'null'
        hasPassword:
          type:
          - boolean
          - 'null'
        id:
          type: number
        locale: {}
        pictureUrl:
          type:
          - string
          - 'null'
        referral:
          type:
          - string
          - 'null'
        role:
          type:
          - string
          - 'null'
          enum:
          - owner
          - user
      required:
      - currentTeamId
      - email
      - emailFree
      - emailVerified
      - emailVerifiedResentAt
      - fullName
      - hasPassword
      - id
      - pictureUrl
      description: A user of the platform.
    LLMAnswer:
      type: object
      properties:
        companyId:
          type: number
        explanation:
          type: string
        fields:
          type: array
          items:
            type: object
            properties:
              description:
                type: string
              key:
                type: string
              type:
                type: string
                enum:
                - array|boolean
                - array|number
                - array|string
                - boolean
                - number
                - string
              values:
                type: array
                items:
                  type: string
            required:
            - key
            - type
        grounded:
          type: boolean
        output:
          type: object
          additionalProperties: {}
        question:
          type: string
        score:
          type: number
      required:
      - companyId
      - output
      - question
      - score
      description: An answer from a query made to the LLM.
    Action:
      type: object
      properties:
        attempts:
          type: number
        cost:
          type:
          - number
          - 'null'
        createdAt:
          type:
          - string
          - 'null'
        data:
          type: object
          properties:
            cleanedUp:
              type: number
            completed:
              type: array
              items:
                type: string
            completedDomains:
              type: number
            completedDomainsSample:
              type: array
              items:
                type: string
            count:
              type: number
            domain:
              type: string
            domains:
              type: array
              items:
                type: string
            domainsSample:
              type: array
              items:
                type: string
            elasticQuery: {}
            failed:
              type: array
              items:
                type: string
            failedDomains:
              type: number
            failedDomainsSample:
              type: array
              items:
                type: string
            fields:
              type: array
              items:
                type: object
                properties:
                  description:
                    type: string
                  key:
                    type: string
                  type:
                    type: string
                    enum:
                    - array|boolean
                    - array|number
                    - array|string
                    - boolean
                    - number
                    - string
                  values:
                    type: array
                    items:
                      type: string
                required:
                - key
                - type
            grounded:
              type: boolean
            job:
              type: string
              enum:
              - ask-domain
              - ask-list
              - enrich-companies
              - enrich-list
              - cleanup-list
            model:
              type: string
              enum:
              - claude
              - claude-mini
              - cousteau
              - cousteau2
              - cousteau2-thinking
              - gpt
              - gpt-mini
              - groq
              - groq-mini
              - llama4
            query:
              type: array
              items:
                $ref: '#/components/schemas/SegmentationCondition'
            question:
              type: string
            team:
              $ref: '#/components/schemas/Team'
            totalDomains:
              type: number
            user:
              $ref: '#/components/schemas/User'
        id:
          type: number
        listId:
          type: number
        promptId:
          type: number
        result:
          type: object
          properties:
            answers:
              type: array
              items:
                $ref: '#/components/schemas/LLMAnswer'
            cleanedUp:
              type: number
            domains:
              type: array
              items:
                type: string
        status:
          type: string
          enum:
          - active
          - completed
          - failed
          - pending
        teamId:
          type: number
        type:
          type: string
          enum:
          - companies:added
          - jobs:request
        updatedAt:
          type:
          - string
          - 'null'
      required:
      - id
      - status
      description: An action tracks a request made to our job queue and its result.
    PaginationMeta:
      type: object
      properties:
        cost:
          type: number
        credits:
          type: number
        currentPage:
          type: number
        firstPage:
          type: number
        freeRequest:
          type: boolean
        lastPage:
          type: number
        maxScrollResultsReached:
          type: boolean
        perPage:
          type: number
        total:
          type: number
      required:
      - cost
      - credits
      - currentPage
      - firstPage
      - freeRequest
      - lastPage
      - perPage
      - total
      description: Metadata about a paginated or billed response.
    CompanyV2:
      type: object
      properties:
        id:
          type: string
        about:
          type: object
          properties:
            businessType:
              type: string
              enum:
              - educational-institution
              - government-agency
              - nonprofit
              - partnership
              - privately-held
              - public-company
              - self-employed
              - sole-proprietorship
              description: The type of business the company is.
            industries:
              type: array
              items:
                type: string
              description: The industries the company is in.
            industry:
              type: string
              description: The main industry of the company.
            languages:
              type: array
              items:
                type: string
              description: The languages the company supports.
            name:
              type: string
              description: The name of the company.
            nameAlts:
              type: array
              items:
                type: string
              description: The alternative names of the company.
            nameLegal:
              type: string
              description: The legal name of the company.
            totalEmployees:
              type: string
              enum:
              - 1-10
              - 10-50
              - 50-200
              - 200-500
              - 500-1k
              - 1k-5k
              - 5k-10k
              - over-10k
              description: The total number of employees the company has.
            totalEmployeesExact:
              type: number
              description: The exact total number of employees the company has.
            yearEnded:
              type: number
              description: The year the company stopped its operations.
            yearFounded:
              type: number
              description: The year the company was founded.
            yearFoundedDate:
              type: string
              description: The date the company was founded.
            yearFoundedPlace:
              type: string
              description: The place the company was founded.
        analytics:
          type: object
          properties:
            lighthouse:
              type: object
              properties:
                accessibility:
                  type: number
                  description: The accessibility score (0-100).
                bestPractices:
                  type: number
                  description: The best practices score (0-100).
                performance:
                  type: number
                  description: The performance score (0-100).
                seo:
                  type: number
                  description: The SEO score (0-100).
                maxServerLatency:
                  type: number
                  description: The maximum server latency.
                numFonts:
                  type: number
                  description: The number of fonts.
                numRequests:
                  type: number
                  description: The number of requests.
                numScripts:
                  type: number
                  description: The number of scripts.
                numStylesheets:
                  type: number
                  description: The number of stylesheets.
                numTasks:
                  type: number
                  description: The number of tasks.
                cumulativeLayoutShift:
                  type: object
                  properties:
                    count:
                      type: number
                    score:
                      type: number
                  description: The cumulative layout shift.
                largestContentfulPaint:
                  type: object
                  properties:
                    ms:
                      type: number
                    score:
                      type: number
                  description: The largest contentful paint.
                timeToInteractive:
                  type: object
                  properties:
                    ms:
                      type: number
                    score:
                      type: number
                  description: The time to interactive.
                totalBlockingTime:
                  type: object
                  properties:
                    ms:
                      type: number
                    score:
                      type: number
                  description: The total blocking time.
              description: Lighthouse and Core Web Vitals analysis.
            monthlyVisitors:
              type: string
              enum:
              - under-10k
              - 10k-50k
              - 50k-100k
              - 100k-500k
              - 500k-1m
              - 1m-10m
              - 10m-50m
              - 50m-100m
              - 100m-500m
              - 500m-1b
              - over-1b
              description: The total number of monthly visitors the company has.
        apps:
          type: object
          properties:
            amazon:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    description: The ID of the app.
                  name:
                    type: string
                    description: The name of the app.
                  rating:
                    type: number
                    description: The rating of the app.
                  reviews:
                    type: number
                    description: The number of reviews the app has.
                  type:
                    type: string
                    enum:
                    - app
                    - developer
                    - extension
                    description: The type of app the company owns.
                  url:
                    type: string
                    description: The URL to the app.
            android:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    description: The ID of the app.
                  name:
