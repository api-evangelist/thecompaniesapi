                    description: The name of the app.
                  rating:
                    type: number
                    description: The rating of the app.
                  reviews:
                    type: number
                    description: The number of reviews the app has.
                  type:
                    type: string
                    enum:
                    - app
                    - developer
                    - extension
                    description: The type of app the company owns.
                  url:
                    type: string
                    description: The URL to the app.
            chrome:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    description: The ID of the app.
                  name:
                    type: string
                    description: The name of the app.
                  rating:
                    type: number
                    description: The rating of the app.
                  reviews:
                    type: number
                    description: The number of reviews the app has.
                  type:
                    type: string
                    enum:
                    - app
                    - developer
                    - extension
                    description: The type of app the company owns.
                  url:
                    type: string
                    description: The URL to the app.
            ios:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    description: The ID of the app.
                  name:
                    type: string
                    description: The name of the app.
                  rating:
                    type: number
                    description: The rating of the app.
                  reviews:
                    type: number
                    description: The number of reviews the app has.
                  type:
                    type: string
                    enum:
                    - app
                    - developer
                    - extension
                    description: The type of app the company owns.
                  url:
                    type: string
                    description: The URL to the app.
            mac:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    description: The ID of the app.
                  name:
                    type: string
                    description: The name of the app.
                  rating:
                    type: number
                    description: The rating of the app.
                  reviews:
                    type: number
                    description: The number of reviews the app has.
                  type:
                    type: string
                    enum:
                    - app
                    - developer
                    - extension
                    description: The type of app the company owns.
                  url:
                    type: string
                    description: The URL to the app.
            meta:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    description: The ID of the app.
                  name:
                    type: string
                    description: The name of the app.
                  rating:
                    type: number
                    description: The rating of the app.
                  reviews:
                    type: number
                    description: The number of reviews the app has.
                  type:
                    type: string
                    enum:
                    - app
                    - developer
                    - extension
                    description: The type of app the company owns.
                  url:
                    type: string
                    description: The URL to the app.
            microsoft:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    description: The ID of the app.
                  name:
                    type: string
                    description: The name of the app.
                  rating:
                    type: number
                    description: The rating of the app.
                  reviews:
                    type: number
                    description: The number of reviews the app has.
                  type:
                    type: string
                    enum:
                    - app
                    - developer
                    - extension
                    description: The type of app the company owns.
                  url:
                    type: string
                    description: The URL to the app.
            playstation:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    description: The ID of the app.
                  name:
                    type: string
                    description: The name of the app.
                  rating:
                    type: number
                    description: The rating of the app.
                  reviews:
                    type: number
                    description: The number of reviews the app has.
                  type:
                    type: string
                    enum:
                    - app
                    - developer
                    - extension
                    description: The type of app the company owns.
                  url:
                    type: string
                    description: The URL to the app.
            xbox:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    description: The ID of the app.
                  name:
                    type: string
                    description: The name of the app.
                  rating:
                    type: number
                    description: The rating of the app.
                  reviews:
                    type: number
                    description: The number of reviews the app has.
                  type:
                    type: string
                    enum:
                    - app
