paths:
  /:
    get:
      description: Get the health status of the API.
      operationId: fetchApiHealth
      tags:
      - utilities
      responses:
        '200':
          description: Get the health status of the API.
          content:
            application/json:
              schema:
                type: object
                properties:
                  healthy:
                    type: boolean
                  nodeName:
                    type: string
                  report:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        displayName:
                          type: string
                        health:
                          type: object
                          properties:
                            healthy:
                              type: boolean
                          required:
                          - healthy
                      required:
                      - displayName
                      - health
                required:
                - healthy
                - nodeName
                - report
  /v2/openapi:
    get:
      description: Get the current OpenAPI specification.
      operationId: fetchOpenApi
      tags:
      - utilities
      responses:
        '200':
          description: Get the current OpenAPI specification.
          content:
            application/json:
              schema:
                type: object
                properties: {}
  /v2/actions:
    get:
      description: Get and filter your actions.
      operationId: fetchActions
      tags:
      - actions
      security:
      - apiKey: []
      parameters:
      - schema:
          type: boolean
        required: false
        name: full
        in: query
      - schema:
          type: array
          items:
            type: number
        required: false
        name: ids
        in: query
      - schema:
          type: number
        required: false
        name: listId
        in: query
      - schema:
          type: number
        required: false
        name: page
        in: query
      - schema:
          type: string
        required: false
        name: search
        in: query
      - schema:
          type: number
        required: false
        name: size
        in: query
      - schema:
          type: string
          enum:
          - active
          - completed
          - failed
          - pending
        required: false
        name: status
        in: query
      - schema:
          type: number
        required: false
        name: teamId
        in: query
      - schema:
          type: string
          enum:
          - jobs:request
          - companies:added
        required: false
        name: type
        in: query
      responses:
        '200':
          description: Get and filter your actions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  actions:
                    type: array
                    items:
                      $ref: '#/components/schemas/Action'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
                required:
                - actions
                - meta
        '400':
          description: The error message
          content:
            application/json:
              schema:
                type: object
                properties:
                  details: {}
                  messages:
                    type: string
                    enum:
                    - invalidListId
                  status:
                    type: number
                    minimum: 400
                    maximum: 511
                required:
                - messages
                - status
        '401':
          description: The error message
          content:
            application/json:
              schema:
                type: object
                properties:
                  details: {}
                  messages:
                    type: string
                    enum:
                    - tokenNotFound
                    - invalidApiSecret
                    - missingApiSecret
                    - userNotAuthenticated
                  status:
                    type: number
                    minimum: 400
                    maximum: 511
                required:
                - messages
                - status
    post:
      description: Request or estimate a new action.
      operationId: requestAction
      tags:
      - actions
      security:
      - apiKey: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
