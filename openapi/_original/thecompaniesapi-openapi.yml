                    - general
                    - marketing
                    - reservations
                    - sales
                    - technical
                    description: The category of the contact.
                  value:
                    type: string
                    description: The value of the contact.
              description: The phones the company has.
            whatsapps:
              type: array
              items:
                type: object
                properties:
                  category:
                    type: string
                    enum:
                    - accounts
                    - channels
                    - general
                    - marketing
                    - reservations
                    - sales
                    - technical
                    description: The category of the contact.
                  value:
                    type: string
