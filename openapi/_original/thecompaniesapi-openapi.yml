                    - accounts
                    - channels
                    - general
                    - marketing
                    - reservations
                    - sales
                    - technical
                    description: The category of the contact.
                  value:
                    type: string
                    description: The value of the contact.
              description: The emails the company has.
            lines:
              type: array
              items:
                type: object
                properties:
