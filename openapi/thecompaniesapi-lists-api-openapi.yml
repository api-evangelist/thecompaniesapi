components:
  schemas:
    User:
      type: object
      properties:
        colorMode:
          type: string
          enum:
          - dark
          - light
          - system
        createdAt:
          type:
          - string
          - 'null'
        currentTeamId:
          type:
          - number
          - 'null'
        email:
          type: string
        emailFree:
          type:
          - boolean
          - 'null'
        emailVerified:
          type:
          - boolean
          - 'null'
        emailVerifiedResentAt:
          type:
          - string
          - 'null'
        fullName:
          type:
          - string
          - 'null'
        hasPassword:
          type:
          - boolean
          - 'null'
        id:
          type: number
        locale: {}
        pictureUrl:
          type:
          - string
          - 'null'
        referral:
          type:
          - string
          - 'null'
        role:
          type:
          - string
          - 'null'
          enum:
          - owner
          - user
      required:
      - currentTeamId
      - email
      - emailFree
      - emailVerified
      - emailVerifiedResentAt
      - fullName
      - hasPassword
      - id
      - pictureUrl
      description: A user of the platform.
    PaginationMeta:
      type: object
      properties:
        cost:
          type: number
        credits:
          type: number
        currentPage:
          type: number
        firstPage:
          type: number
        freeRequest:
          type: boolean
        lastPage:
          type: number
        maxScrollResultsReached:
          type: boolean
        perPage:
          type: number
        total:
          type: number
      required:
      - cost
      - credits
      - currentPage
      - firstPage
      - freeRequest
      - lastPage
      - perPage
      - total
      description: Metadata about a paginated or billed response.
    SegmentationCondition:
      type: object
      properties:
        attribute:
          type: string
          enum:
          - about.businessType
          - about.industries
          - about.industry
          - about.name
          - about.totalEmployees
          - about.yearFounded
          - ai.search
          - analytics.monthlyVisitors
          - apps
          - codes.naics
          - codes.sic
          - contacts
          - domain.domain
          - domain.tld
          - finances.revenue
          - finances.stockExchange
          - locations.headquarters.city.code
          - locations.headquarters.continent.code
          - locations.headquarters.country.code
          - locations.headquarters.county.code
          - locations.headquarters.state.code
          - meta.listIds
          - meta.score
          - meta.syncedAt
          - socials
          - socials.linkedin.id
          - technologies.active
          - technologies.categories
          - urls
        blockedOperator:
          type: boolean
        operator:
          type: string
          enum:
          - and
          - or
        sign:
          type: string
          enum:
          - equals
          - exactEquals
          - greater
          - lower
          - notEquals
        values:
          type: array
          items:
            anyOf:
            - type: string
            - type: number
      required:
      - attribute
      - operator
      - sign
      - values
      description: A condition for our platform segmentation engine.
    CompanyV2:
      type: object
      properties:
        id:
          type: string
        about:
          type: object
          properties:
            businessType:
              type: string
              enum:
              - educational-institution
              - government-agency
              - nonprofit
              - partnership
              - privately-held
              - public-company
              - self-employed
              - sole-proprietorship
              description: The type of business the company is.
            industries:
              type: array
              items:
                type: string
              description: The industries the company is in.
            industry:
              type: string
              description: The main industry of the company.
            languages:
              type: array
              items:
                type: string
              description: The languages the company supports.
            name:
              type: string
              description: The name of the company.
            nameAlts:
              type: array
              items:
                type: string
              description: The alternative names of the company.
            nameLegal:
              type: string
              description: The legal name of the company.
            totalEmployees:
              type: string
              enum:
              - 1-10
              - 10-50
              - 50-200
              - 200-500
              - 500-1k
              - 1k-5k
              - 5k-10k
              - over-10k
              description: The total number of employees the company has.
            totalEmployeesExact:
              type: number
              description: The exact total number of employees the company has.
            yearEnded:
              type: number
              description: The year the company stopped its operations.
            yearFounded:
              type: number
              description: The year the company was founded.
            yearFoundedDate:
              type: string
              description: The date the company was founded.
            yearFoundedPlace:
              type: string
              description: The place the company was founded.
        analytics:
          type: object
          properties:
            lighthouse:
              type: object
              properties:
                accessibility:
                  type: number
                  description: The accessibility score (0-100).
                bestPractices:
                  type: number
                  description: The best practices score (0-100).
                performance:
                  type: number
                  description: The performance score (0-100).
                seo:
                  type: number
                  description: The SEO score (0-100).
                maxServerLatency:
                  type: number
                  description: The maximum server latency.
                numFonts:
                  type: number
                  description: The number of fonts.
                numRequests:
                  type: number
                  description: The number of requests.
                numScripts:
                  type: number
                  description: The number of scripts.
                numStylesheets:
                  type: number
                  description: The number of stylesheets.
                numTasks:
                  type: number
                  description: The number of tasks.
                cumulativeLayoutShift:
                  type: object
                  properties:
                    count:
                      type: number
                    score:
                      type: number
                  description: The cumulative layout shift.
                largestContentfulPaint:
                  type: object
                  properties:
                    ms:
                      type: number
                    score:
                      type: number
                  description: The largest contentful paint.
                timeToInteractive:
                  type: object
                  properties:
                    ms:
