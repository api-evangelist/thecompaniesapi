      - schema:
          type: number
          minimum: 1
          maximum: 100
        required: false
        name: size
        in: query
      - schema:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
                enum:
                - about.businessType
                - about.industries
                - about.industry
                - about.name
                - about.totalEmployees
                - about.yearFounded
                - analytics.monthlyVisitors
                - apps
                - codes.naics
                - codes.sic
                - contacts
                - domain.domain
                - domain.tld
                - finances.revenue
                - locations.headquarters.city.code
                - locations.headquarters.country.code
                - locations.headquarters.county.code
                - locations.headquarters.state.code
                - meta.score
                - meta.syncedAt
                - socials
                - technologies.active
                - urls
              missing:
                type: string
                enum:
                - _first
                - _last
              order:
                type: string
                enum:
                - asc
                - desc
            required:
            - key
            - order
        required: false
        name: sortFields
        in: query
      - schema:
          type: string
          enum:
          - about.businessType
          - about.industries
          - about.industry
          - about.name
          - about.totalEmployees
          - about.yearFounded
          - analytics.monthlyVisitors
          - apps
          - codes.naics
          - codes.sic
          - contacts
          - domain.domain
          - domain.tld
          - finances.revenue
