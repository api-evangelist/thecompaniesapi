openapi: 3.1.0
info:
  contact:
    email: support@thecompaniesapi.com
    name: The Companies API
    url: https://www.thecompaniesapi.com
  description: An enrichment platform to search and retrieve information about companies
  termsOfService: https://www.thecompaniesapi.com/product/terms
  title: The Companies actions lists API
  version: 2.0.0
servers:
- description: Production server
  url: https://api.thecompaniesapi.com
tags:
- name: lists
paths:
  /v2/lists:
    get:
      description: Get and filter your lists.
      operationId: fetchLists
      tags:
      - lists
      security:
      - apiKey: []
      parameters:
      - schema:
          type: number
        required: false
        name: page
        in: query
      - schema:
          type: number
          minimum: 1
          maximum: 500
        required: false
        name: size
        in: query
      responses:
        '200':
          description: Get and filter your lists.
          content:
            application/json:
              schema:
                type: object
                properties:
                  lists:
                    type: array
                    items:
                      $ref: '#/components/schemas/List'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
                required:
                - lists
                - meta
        '401':
          description: The error message
          content:
            application/json:
              schema:
                type: object
                properties:
                  details: {}
                  messages:
                    type: string
                    enum:
                    - tokenNotFound
                    - invalidApiSecret
                    - missingApiSecret
                    - userNotAuthenticated
                  status:
                    type: number
                    minimum: 400
                    maximum: 511
                required:
                - messages
                - status
    post:
      description: Create a new list.
      operationId: createList
      tags:
      - lists
      security:
      - apiKey: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                dynamic:
                  type: boolean
                imported:
                  type: boolean
                mailFrequency:
                  type: string
                  enum:
                  - disabled
                  - daily
                  - weekly
                  - monthly
                maxCompanies:
                  type: number
                name:
                  type: string
                  maxLength: 255
                processInitialized:
                  type: boolean
                query:
                  type: array
                  items:
                    $ref: '#/components/schemas/SegmentationCondition'
                similarDomains:
                  type: array
                  items:
                    type: string
              required:
              - name
      responses:
        '200':
          description: Create a new list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List'
        '401':
          description: The error message
          content:
            application/json:
              schema:
                type: object
                properties:
                  details: {}
                  messages:
                    type: string
                    enum:
                    - tokenNotFound
                    - invalidApiSecret
                    - missingApiSecret
                    - userNotAuthenticated
                  status:
                    type: number
                    minimum: 400
                    maximum: 511
                required:
                - messages
                - status
  /v2/lists/{listId}:
    patch:
      description: Update a list.
      operationId: updateList
      tags:
      - lists
      security:
      - apiKey: []
      parameters:
      - schema:
          type: number
        required: true
        name: listId
        in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                dynamic:
                  type: boolean
                lastSeen:
                  type: boolean
                mailFrequency:
                  type: string
                  enum:
                  - disabled
                  - daily
                  - weekly
                  - monthly
                maxCompanies:
                  type:
                  - number
                  - 'null'
                  minimum: 0
                  maximum: 1000000
                name:
                  type: string
                  maxLength: 255
                query:
                  type: array
                  items:
                    $ref: '#/components/schemas/SegmentationCondition'
                resync:
                  type: boolean
      responses:
        '200':
          description: Update a list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List'
        '400':
          description: The error message
          content:
            application/json:
              schema:
                type: object
                properties:
                  details: {}
                  messages:
                    type: string
                    enum:
                    - listNotFound
                  status:
                    type: number
                    minimum: 400
                    maximum: 511
                required:
                - messages
                - status
        '401':
          description: The error message
          content:
            application/json:
              schema:
                type: object
                properties:
                  details: {}
                  messages:
                    type: string
                    enum:
                    - tokenNotFound
                    - invalidApiSecret
                    - missingApiSecret
                    - userNotAuthenticated
                  status:
                    type: number
                    minimum: 400
                    maximum: 511
                required:
                - messages
                - status
        '403':
          description: The error message
          content:
            application/json:
              schema:
                type: object
                properties:
                  details: {}
                  messages:
                    type: string
                    enum:
                    - userCurrentTeamIsNotInstanceOwner
                  status:
                    type: number
                    minimum: 400
                    maximum: 511
                required:
                - messages
                - status
    delete:
      description: Delete a list.
      operationId: deleteList
      tags:
      - lists
      security:
      - apiKey: []
      parameters:
      - schema:
          type: number
        required: true
        name: listId
        in: path
      responses:
        '200':
          description: Delete a list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List'
        '400':
          description: The error message
          content:
            application/json:
              schema:
                type: object
                properties:
                  details: {}
                  messages:
                    type: string
                    enum:
                    - listNotFound
                  status:
                    type: number
                    minimum: 400
                    maximum: 511
                required:
                - messages
                - status
        '401':
          description: The error message
          content:
            application/json:
              schema:
                type: object
                properties:
                  details: {}
                  messages:
                    type: string
                    enum:
                    - tokenNotFound
                    - invalidApiSecret
                    - missingApiSecret
                    - userNotAuthenticated
                  status:
                    type: number
                    minimum: 400
                    maximum: 511
                required:
                - messages
                - status
        '403':
          description: The error message
          content:
            application/json:
              schema:
                type: object
                properties:
                  details: {}
                  messages:
                    type: string
                    enum:
                    - userCurrentTeamIsNotInstanceOwner
                  status:
                    type: number
                    minimum: 400
                    maximum: 511
                required:
                - messages
                - status
