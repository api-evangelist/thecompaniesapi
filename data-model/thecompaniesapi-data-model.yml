note: >-
  Entity graph derived from the published OpenAPI $ref links and id-reference fields. Two
  distinct domains sit in one specification: a REFERENCE domain (companies, industries,
  technologies, locations, job titles) that is read-only global data the provider curates,
  and an ACCOUNT domain (user, team, list, action, prompt) that is per-tenant state the caller
  mutates. Identifiers are numeric integers except Company, which is keyed by domain name in
  every path — the domain IS the primary key an integrator uses, and CompanyV2.id is a string.
  There is no key-prefix convention (no cus_/acct_-style prefixes).
