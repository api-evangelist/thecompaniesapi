description: The Companies API applies two independent controls. First, a per-second request rate limit
  (RPS) that is tied to the subscription plan - Startup 50 RPS, Scaleup 250 RPS, Enterprise 1,000 RPS.
  Second, a monthly credit allowance that meters how much work an account can perform; each call spends
  credits and, once the included allowance is exhausted, overage credits are billed per 1,000. Long-running
  and bulk workloads are dispatched through the asynchronous Actions job queue so they do not have to
  be issued as a burst of synchronous requests.
notes: 'Reconciled against the live rate-limit reference and pricing page on 2026-08-14. The RPS figures
  are confirmed by both pages: Startup 50, Scaleup 250, Enterprise 1,000 requests per second. RESPONSE
  HEADERS: none. The API returns no X-RateLimit-*, no RateLimit-* and no Retry-After header on any response
  — probed live and searched the published reference, which says only "your requests will temporarily
  be blocked with a 429 Too Many Requests response. You can retry after a short delay." A client therefore
  has no runtime signal for its remaining request budget and must pace itself from the documented plan
  number. 429 is also declared on ZERO of the 44 operations in the published OpenAPI, so a generated client
  will not model the throttle path at all. The credit balance IS returned at runtime (meta.credits / meta.cost
  on every response), so the quota that actually binds is observable even though the rate limit is not.'
sources:
- https://www.thecompaniesapi.com/pricing
- https://www.thecompaniesapi.com/api
- https://api.thecompaniesapi.com/v2/openapi
responseCodes:
  throttled: 429
  creditsExhausted: 403
  note: 429 is the throttle. Credit exhaustion is a different failure and arrives as 403 noCreditsRemaining,
    not 429.
limits:
- name: Requests Per Second (Startup)
  scope: account
  metric: requests
  limit: 50/sec
  notes: Per-plan synchronous request rate limit on the Startup tier.
- name: Requests Per Second (Scaleup)
  scope: account
  metric: requests
  limit: 250/sec
  notes: Per-plan synchronous request rate limit on the Scaleup tier.
- name: Requests Per Second (Enterprise)
  scope: account
  metric: requests
  limit: 1000/sec
  notes: Per-plan synchronous request rate limit on the Enterprise tier.
- name: Monthly Credit Allowance
  scope: account
  metric: credits
  limit: per plan (50k / 250k / 500k)
  notes: Each call spends credits; overage billed per 1,000 credits once the allowance is used.
- name: Free Signup Credits
  scope: account
  metric: credits
  limit: 500 (one-time)
  notes: Granted to new accounts for evaluation, no credit card required.
policies:
- name: Credit Metering
  description: Work is metered in credits rather than by a flat request quota; different operations can
    cost different amounts of credits.
- name: Asynchronous Actions
  description: Bulk and long-running jobs run through the Actions queue (POST /v2/actions) and are polled
    over REST, smoothing demand against the per-second limit.
- name: Backoff Strategy
  description: Clients should implement exponential backoff with jitter and honor Retry-After on 429 responses.
